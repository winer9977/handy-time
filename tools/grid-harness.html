<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font: 9px sans-serif; }
  .box { width:310px; height:400px; border:1px solid #ccc; }
  /* 复现日历周视图：7 列网格 + nowrap 的日程条 */
  .g1 { display:grid; grid-template-columns:repeat(7,1fr); height:100%; }
  .g2 { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); height:100%; }
  .cell { border-right:1px solid #eee; overflow:hidden; }
  .cell.bad  { min-width:auto; }
  .cell.good { min-width:0; }
  .ev { white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        border-left:2px solid #4c8dff; background:#eef; padding:1px 3px; }
</style></head><body>
<div id="bad" class="box"><div class="g1">
  <div class="cell bad"><div class="ev">09:30 晨会 项目评审同步会议</div><div class="ev">出差</div></div>
  <div class="cell bad"></div><div class="cell bad"></div><div class="cell bad"></div>
  <div class="cell bad"></div><div class="cell bad"></div><div class="cell bad"><div class="ev">第十四列不该存在</div></div>
</div></div>
<div id="good" class="box"><div class="g2">
  <div class="cell good"><div class="ev">09:30 晨会 项目评审同步会议</div><div class="ev">出差</div></div>
  <div class="cell good"></div><div class="cell good"></div><div class="cell good"></div>
  <div class="cell good"></div><div class="cell good"></div><div class="cell good"></div>
</div></div>
<script>
  window.MEASURE = function(){
    const out = {};
    for (const key of ['bad','good']) {
      const cells = [...document.querySelectorAll('#'+key+' .cell')];
      const widths = cells.map(c => +c.getBoundingClientRect().width.toFixed(1));
      const box = document.querySelector('#'+key).getBoundingClientRect();
      const last = cells[cells.length-1].getBoundingClientRect();
      out[key] = {
        widths,
        sum: +widths.reduce((a,b)=>a+b,0).toFixed(1),
        boxW: +box.width.toFixed(1),
        // 第 7 列右缘是否超出容器（超出即被裁掉）
        lastRightInside: +(last.right - box.right).toFixed(1),
      };
    }
    return out;
  };
  // 自测量：把结果写进 DOM，供 `msedge --headless --dump-dom` 读回真实数字
  const r = MEASURE();
  const pre = document.createElement('pre');
  pre.id = 'RESULT';
  pre.textContent = 'RESULT::' + JSON.stringify(r);
  document.body.appendChild(pre);
</script>
</body></html>
