; ==================================================================
;  xhy 时钟 · Rainmeter 皮肤
;
;  与 xhy 桌面挂件同一视觉语言：黄底标识线、圆角半透明板、同字体、同墨色。
;
;  用法：把本文件放进 Rainmeter 的 Skins\xhy\clock\ 后载入。
;  切主题：只改下面 [Variables] 的 Theme = Light 或 Dark，其余自动跟随。
; ==================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

; ── 主题：颜色全部走变量，切 Theme 即整套换色 ─────────
[Variables]
; Light / Dark
Theme=Light

FontName="Microsoft YaHei UI"
TimeSize=42
DateSize=13

; 黄底标识线（与 xhy 挂件同色）
Accent=245,197,24

; 浅色主题配色
; 深色主题：把下面三行整体换成注释里标注的深色值
;   BoardColor=28,30,34,205     （深色板）
;   StrokeColor=255,255,255,24  （深色描边）
;   InkColor=232,234,237        （浅墨）
;   Ink2Color=154,160,166       （浅灰）
BoardColor=255,255,255,190
StrokeColor=0,0,0,20
InkColor=35,38,43
Ink2Color=107,114,128

; ── 背景板 ──────────────────────────────────────────
[Back]
Meter=Shape
Shape=Rectangle 0,0,240,96,12 | Fill Color #BoardColor# | Stroke Color #StrokeColor#

; ── 顶部黄色标识线 ──────────────────────────────────
[AccentBar]
Meter=Shape
Shape=Rectangle 0,0,240,3,12 | Fill Color #Accent,90
Shape2=Rectangle 8,0,40,3 | Fill Color #Accent

; ── 时间 ────────────────────────────────────────────
[Time]
Measure=Time
Format=%H:%M

[TimeText]
Meter=String
MeasureName=Time
X=120
Y=10
FontFace=#FontName#
FontSize=#TimeSize#
FontColor=#InkColor#
StringAlign=Center
AntiAlias=1
Text=%1

; ── 日期 + 星期 ─────────────────────────────────────
[Date]
Measure=Time
Format=%#m月%#d日

; 星期用 %w（0=周日..6=周六）映射，避免区域化 %a 的不确定性
[Wday]
Measure=Time
Format=%w
Substitute="0":"周日","1":"周一","2":"周二","3":"周三","4":"周四","5":"周五","6":"周六"

[DateText]
Meter=String
MeasureName=Date
MeasureName2=Wday
X=120
Y=68
FontFace=#FontName#
FontSize=#DateSize#
FontColor=#Ink2Color#
StringAlign=Center
AntiAlias=1
Text="%1  ·  %2"
