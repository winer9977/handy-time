; ==================================================================
;  xhy 天气 · Rainmeter 皮肤
;
;  与 xhy 桌面挂件同一视觉语言（黄底标识线 / 圆角半透明板 / 同字体）。
;  数据源用和风天气 QWeather（开发者免费版即可）：
;    1) 注册 https://dev.qweather.com → 创建项目 → 拿到 API Key
;    2) 把 [Variables] 里的 Key 换成你的；Location 换成你的城市 ID
;       （北京 101010100 / 上海 101020100 / 广州 101280100 / 深圳 101280600）
;    3) 把本文件放进 Rainmeter 的 Skins\xhy\weather\ 后载入
;
;  未填 Key 时不会报错，各字段显示 "--"。
; ==================================================================

[Rainmeter]
Update=1000*60
AccurateText=1
DynamicWindowSize=1

[Variables]
Key=
Location=101010100
FontName="Microsoft YaHei UI"
Accent=245,197,24
Ink=35,38,43
Ink2=107,114,128

; ── 拉取实时天气（WebParser） ───────────────────────
; 未填 Key 时 URL 指向本地不存在的路径，各项取值为空，
; 由下面各 Meter 的 AlternativeText 兜底显示 "--"。
[WeatherRaw]
Measure=Plugin
Plugin=WebParser
URL=https://devapi.qweather.com/v7/weather/now?location=#Location#&key=#Key#
UpdateRate=1800
RegExp=(?siU)"temp":"(.*?)".*"text":"(.*?)".*"humidity":"(.*?)".*"windDir":"(.*?)".*"windScale":"(.*?)"
StringIndex=1
Timeout=8

[mTemp]
Measure=Plugin
Plugin=WebParser
URL=[WeatherRaw]
StringIndex=1
Substitute='"':""

[mText]
Measure=Plugin
Plugin=WebParser
URL=[WeatherRaw]
StringIndex=2
Substitute='"':""

[mHum]
Measure=Plugin
Plugin=WebParser
URL=[WeatherRaw]
StringIndex=3
Substitute='"':""

[mWindDir]
Measure=Plugin
Plugin=WebParser
URL=[WeatherRaw]
StringIndex=4
Substitute='"':""

[mWindScale]
Measure=Plugin
Plugin=WebParser
URL=[WeatherRaw]
StringIndex=5
Substitute='"':""

; ── 背景板 ──────────────────────────────────────────
[Back]
Meter=Shape
Shape=Rectangle 0,0,240,96,12 | Fill Color 255,255,255,190 | Stroke Color 0,0,0,20

[AccentBar]
Meter=Shape
Shape=Rectangle 0,0,240,3,12 | Fill Color #Accent,90
Shape2=Rectangle 8,0,40,3 | Fill Color #Accent

; ── 温度 ────────────────────────────────────────────
[Tmp]
Meter=String
MeasureName=mTemp
X=14
Y=12
FontFace=#FontName#
FontSize=30
FontColor=#Ink#
AntiAlias=1
Text=%1°
AlternativeText=--°

; ── 状况 + 湿度 ─────────────────────────────────────
[Desc]
Meter=String
MeasureName=mText
MeasureName2=mHum
X=126
Y=26
FontFace=#FontName#
FontSize=13
FontColor=#Ink#
AntiAlias=1
Text="%1 · 湿度 %2%%"
AlternativeText="天气 --"

; ── 风 ──────────────────────────────────────────────
[Wind]
Meter=String
MeasureName=mWindDir
MeasureName2=mWindScale
X=126
Y=48
FontFace=#FontName#
FontSize=11
FontColor=#Ink2#
AntiAlias=1
Text="%1风 %2级"
AlternativeText="风 --"

; ── 底部提示 ────────────────────────────────────────
[Hint]
Meter=String
X=14
Y=66
FontFace=#FontName#
FontSize=9
FontColor=#Ink2#
AntiAlias=1
Text="在 .ini 的 [Variables] 里填 Key 即可显示"
